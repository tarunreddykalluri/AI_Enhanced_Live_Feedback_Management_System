<!DOCTYPE html>
<html>
<head>
    <title>Feedback Received</title>
</head>
<body>
    {% csrf_token %}

    <h2>Success! Feedback saved for {{ movie }}.</h2>
    
    <div id="ai-container" style="border: 1px solid #444; padding: 20px; margin-top: 20px; background: #f9f9f9;">
        <h3>AI Analysis</h3>
        <p id="loading-text">Click the button below to analyze this feedback.</p>
        
        <div id="results" style="display:none;">
            <p><strong>Sentiment:</strong> <span id="sent"></span></p>
            <p><strong>Summary:</strong> <span id="summ"></span></p>
            <p><strong>Suggestion:</strong> <span id="sugg"></span></p>
        </div>

        <button id="ai-btn" onclick="runAI({{ id }})">Run AI Analysis</button>
    </div>

    <script>
    async function runAI(feedbackId) {
        const btn = document.getElementById('ai-btn');
        const loadingText = document.getElementById('loading-text');
        
        btn.disabled = true;
        btn.innerText = "Processing...";

        try {
            // This fetch calls the URL we defined in urls.py
            const response = await fetch(`/analyze/${feedbackId}/`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                }
            });

            const result = await response.json();

            if (result.status === 'success') {
                document.getElementById('results').style.display = 'block';
                document.getElementById('sent').innerText = result.data.sentiment;
                document.getElementById('summ').innerText = result.data.summary;
                document.getElementById('sugg').innerText = result.data.suggestions;
                loadingText.innerText = "Analysis Complete!";
                btn.style.display = 'none';
            } else {
                alert("Error: " + result.message);
                btn.disabled = false;
                btn.innerText = "Try Again";
            }
        } catch (e) {
            console.error(e);
            alert("Network error. Check the Django terminal.");
        }
    }
    </script>
</body>
</html>
